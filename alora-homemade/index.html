<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Alora HomeMade Menu...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #faf7f5;
      color: #241916;
      text-align: center;
      padding: 20px;
    }
    a {
      color: #9c4a66;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div>
    <p>Opening Alora HomeMade menu...</p>
    <p id="fallback" style="display: none; margin-top: 12px;">
      <a id="fallback-link" href="#">Tap here if you are not redirected</a>
    </p>
  </div>

  <script>
    const TARGET_URL = 'https://script.google.com/macros/s/AKfycbx4X2l5A2k8AH4w9exg7RWWWUVjYNH9fj3zheQ0JJRk/exec';

    if (TARGET_URL && !TARGET_URL.includes('AKfycbx4X2l5A2k8AH4w9exg7RWWWUVjYNH9fj3zheQ0JJRk')) {
      const fallbackLink = document.getElementById('fallback-link');
      fallbackLink.href = TARGET_URL;
      document.getElementById('fallback').style.display = 'block';

      try {
        window.top.location.replace(TARGET_URL);
      } catch (err) {
        window.location.href = TARGET_URL;
      }
    }
  </script>
</body>
</html>
